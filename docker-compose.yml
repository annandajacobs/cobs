
services:
  db:
    image: postgres:16
    container_name: cobs_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cobs
      POSTGRES_USER: cobs_user
      POSTGRES_PASSWORD: cobs_dev_password
    ports:
      - "5433:5432"
    volumes:
      - cobs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobs_user -d cobs"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cobs_postgres_data:
